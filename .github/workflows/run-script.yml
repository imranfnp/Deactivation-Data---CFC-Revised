name: Run PowerShell Every Four Hours

on:
  schedule:
    - cron: '17 */4 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run-script:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Download repository files
        uses: actions/checkout@v4

      - name: Run PowerShell script
        shell: pwsh
        run: ./script.ps1
